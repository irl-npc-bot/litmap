name: Ad-hoc query (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          DEBUG_FETCH: "1"
        run: node scripts/adhoc-query.js 2>&1 | tee adhoc-debug.log
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add adhoc-results.json adhoc-debug.log
          git commit -m "Ad-hoc query results" || echo "nothing to commit"
          git push
