name: Ad-hoc query (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CORS headers on Google Books API (GET, with Origin header)
        run: |
          curl -s -D - -o /dev/null \
            -H "Origin: https://irl-npc-bot.github.io" \
            "https://www.googleapis.com/books/v1/volumes?q=inpublisher:%22Del+Rey%22&maxResults=1" > cors-check.txt
          cat cors-check.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cors-check.txt
          git commit -m "CORS check v2" || echo "nothing to commit"
          git push
