name: Ad-hoc query (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CORS headers on Google Books API
        run: |
          echo "=== response headers for a normal request ===" > cors-check.txt
          curl -sI "https://www.googleapis.com/books/v1/volumes?q=inpublisher:%22Del%20Rey%22" >> cors-check.txt
          echo "" >> cors-check.txt
          echo "=== response headers WITH an Origin header (simulating browser CORS preflight-adjacent request) ===" >> cors-check.txt
          curl -sI -H "Origin: https://irl-npc-bot.github.io" "https://www.googleapis.com/books/v1/volumes?q=inpublisher:%22Del%20Rey%22" >> cors-check.txt
          cat cors-check.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cors-check.txt
          git commit -m "CORS check" || echo "nothing to commit"
          git push
