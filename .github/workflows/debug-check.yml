name: Debug check (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compare Open Library date precision vs Google Books for the same imprints
        run: |
          cat > check-openlibrary.mjs << 'EOF'
          const terms = ["Del Rey", "Tor Books", "Orbit", "Harper Voyager"];
          for (const term of terms) {
            try {
              const url = `https://openlibrary.org/search.json?publisher=${encodeURIComponent(term)}&sort=new&limit=15&fields=title,publisher,publish_date,first_publish_year`;
              const res = await fetch(url, {
                headers: { "User-Agent": "litmap-research/1.0 (testing data source feasibility)" },
              });
              console.log(`\n=== ${term} (status ${res.status}) ===`);
              if (!res.ok) { console.log("body:", await res.text()); continue; }
              const data = await res.json();
              console.log("numFound:", data.numFound);
              for (const doc of (data.docs || []).slice(0, 8)) {
                console.log(" -", JSON.stringify(doc.publish_date), "|", doc.title);
              }
            } catch (err) {
              console.log(`\n=== ${term} FAILED: ${err.message} ===`);
            }
          }
          EOF
          node check-openlibrary.mjs > debug-output.txt 2>&1 || true
          cat debug-output.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug-output.txt
          git commit -m "Open Library precision check" || echo "nothing to commit"
          git push
