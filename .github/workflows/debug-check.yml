name: Debug check (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Full window fetch using the deployed (key-injected) module
        run: |
          cat > verify2.mjs << 'EOF'
          // Fetch the ACTUAL deployed module (with real key already injected)
          // and run a full fetchWindow, exactly as a date click would.
          const res = await fetch("https://irl-npc-bot.github.io/litmap/js/booksApi.js");
          const src = await res.text();
          const dataUrl = "data:text/javascript;base64," + Buffer.from(src).toString("base64");
          const { fetchWindow } = await import(dataUrl);
          const start = Date.now();
          const { fromISO, toISO, releases, failedTerms } = await fetchWindow("2026-08-15", 30);
          console.log(`window: ${fromISO} to ${toISO}`);
          console.log(`releases found: ${releases.length}`);
          console.log(`failed terms: ${failedTerms.length}`, failedTerms);
          console.log(`took ${Date.now() - start}ms`);
          for (const r of releases.slice(0, 10)) console.log(" -", r.releaseDate, r.title, r.publisherGroup);
          EOF
          node verify2.mjs > debug-output.txt 2>&1
          cat debug-output.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug-output.txt
          git commit -m "debug output v2" || echo "nothing to commit"
          git push
