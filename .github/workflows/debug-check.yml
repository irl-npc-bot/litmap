name: Debug check (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CORS header check
        run: |
          curl -s -D - -o /dev/null \
            -H "Origin: https://irl-npc-bot.github.io" \
            "https://www.googleapis.com/books/v1/volumes?q=inpublisher:%22Del+Rey%22&maxResults=1" > debug-output.txt
          echo "" >> debug-output.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug-output.txt
          git commit -m "debug output" || echo "nothing to commit"
          git push
