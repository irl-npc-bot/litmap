name: Debug check (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Simulate browser click (unauthenticated, same concurrency)
        run: node scripts/simulate-browser.mjs > debug-output.txt 2>&1; cat debug-output.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug-output.txt
          git commit -m "debug output" || echo "nothing to commit"
          git push
