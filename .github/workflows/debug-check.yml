name: Debug check (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Realistic-timing verification against live page
        run: |
          cat > verify4.mjs << 'EOF'
          const base = "https://silentonair.github.io/litmap";
          const res = await fetch(`${base}/js/booksApi.js`);
          const src = await res.text();
          const dataUrl = "data:text/javascript;base64," + Buffer.from(src).toString("base64");
          const { fetchWindow, fetchUpcoming } = await import(dataUrl);

          console.log("--- Call 1: fetchWindow (simulates clicking a date) ---");
          const w = await fetchWindow("2026-08-15", 30);
          console.log(`releases: ${w.releases.length}, failed: ${w.failedTerms.length}`, w.failedTerms);

          console.log("\n--- waiting 5s (simulates a human looking at results before next click) ---");
          await new Promise(r => setTimeout(r, 5000));

          console.log("\n--- Call 2: fetchUpcoming (simulates clicking 'Show upcoming') ---");
          const start = Date.now();
          const u = await fetchUpcoming(12);
          console.log(`releases: ${u.releases.length}, failed: ${u.failedTerms.length}, took ${Date.now()-start}ms`, u.failedTerms);
          const uDay = u.releases.filter(r => r.precision === "day").length;
          const uMonth = u.releases.filter(r => r.precision === "month").length;
          console.log(`day-precision: ${uDay}, month-precision: ${uMonth}`);
          for (const r of u.releases.slice(0, 20)) {
            console.log(" -", r.releaseDate, `(${r.precision})`, "|", r.title, "|", r.publisherGroup);
          }

          console.log("\n--- Adversarial: Call 3 immediately (zero delay) to test backoff recovery ---");
          const start2 = Date.now();
          const w2 = await fetchWindow("2026-08-15", 30);
          console.log(`releases: ${w2.releases.length}, failed: ${w2.failedTerms.length}, took ${Date.now()-start2}ms`, w2.failedTerms);
          EOF
          node verify4.mjs > debug-output.txt 2>&1 || true
          cat debug-output.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug-output.txt
          git commit -m "verify with realistic timing" || echo "nothing to commit"
          git push
