name: Update sci-fi release data

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * 1'  # every Monday at 06:00 UTC

permissions:
  contents: write

jobs:
  update-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch releases
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: node scripts/fetch-releases.js 2>&1 | tee data/_debug-fetch-log.txt

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/releases.json data/_debug-fetch-log.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update release data ($(date -u +%Y-%m-%d))"
            git push
          fi
